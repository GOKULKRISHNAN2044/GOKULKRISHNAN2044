        letter-spacing='normal'>
        <textPath href='#path0' xlink:href='#path0'>
            Hey there! I'm Gokulkrishnan G
        </textPath>
    </text>

    <path id='path1'>
        <animate id='d1' attributeName='d' begin='d0.end'
